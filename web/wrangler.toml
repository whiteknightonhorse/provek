name = "provek"
compatibility_date = "2026-08-20"
pages_build_output_dir = "dist"

# The durable record of every intake submission. Nothing is only an email: a notification can fail,
# and a request the operator never saw must still exist.
[[kv_namespaces]]
binding = "INTAKE"
id = "5d93877f53d94f3fbc4863a0195fc9a4"

# Rate-limit counters for the GenLayer Evidence Witness relay (`functions/api/witness-submit.js`):
# per-client-per-hour and global-per-day counts, nothing else - never a request body or an address.
# THE ID BELOW IS A PLACEHOLDER: the dispatcher creates the namespace and replaces it before deploy.
[[kv_namespaces]]
binding = "WITNESS_RL"
id = "fd596e3a7a0b4f6092ec694bb1e9d68f"
