name: gates

# THE SAME GATES AS scripts/push.sh, BUT NOT DEPENDENT ON WHOEVER PUSHES.
#
# Until this file existed, every gate lived in push.sh on one server and therefore ran only when
# the person pushing chose to run it. A gate whose execution depends on the discipline of the
# person it guards is a habit, not a control.
#
# NOTE ON BILLING, NOW EXPIRED. This said Actions minutes were exhausted until 2026-09-01 and that
# the workflow would not run before then. The escape clause in the same note is what happened: the
# repository is public, so Actions are free and the condition is gone. Measured on 2026-08-20 rather
# than assumed - `/commits/{sha}/check-runs` reports four successful runs of this workflow on each of
# today's commits. A dated condition that has quietly expired is a false statement about the
# pipeline, and a false green about a gate is the one this repository may least afford.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

  # A GATE THAT RUNS ONLY WHEN SOMEBODY PUSHES CANNOT SEE ABANDONMENT.
  #
  # T-F3 added an obligation that goes red when nobody re-runs the cohort inside its interval, and
  # said so in four places - while every trigger above requires a person to act first. In the one
  # state the obligation exists for, nobody acts, so nothing ran, nothing went red, and the eight
  # published rows would have lapsed in silence. The tripwire needed a clock. Found by Fable, in
  # the change that claimed the property.
  #
  # WHAT THIS DOES NOT PROVE, AND WHERE IT STOPS WORKING. Whether GitHub dispatches a scheduled run
  # is not observable from the audit host, and scheduled workflows are queued rather than guaranteed
  # at the minute named. And GitHub disables a public repository's schedules automatically after
  # sixty days with no repository activity - so the clock eventually switches itself off in the same
  # state it was added for, and says nothing when it does. The bound is worked out once, in
  # docs/LIVENESS_OPERATIONS.md, and not restated here (L-2): the short of it is that the re-issue
  # finding fires daily from day 23 and the rows lapse at day 30, so the obligation's whole
  # lifecycle happens well inside the sixty.
  schedule:
    - cron: "17 7 * * *"

# THE TOKEN THIS WORKFLOW HANDS TO SOMEBODY ELSE'S CODE, NARROWED TO WHAT IT ACTUALLY USES.
#
# With no `permissions:` key at all, GitHub grants the default set, and that default is wider than
# any job here needs. Every job below only ever READS this tree: it checks out, installs an
# interpreter, and runs a checker. None of the five writes an issue, a package, a check run or a
# commit - so every one of those was a permission handed out on the strength of nobody having said
# otherwise.
#
# That mattered here for a reason narrower than hygiene. The steps below run third-party actions,
# and until this commit they named those actions BY TAG. A tag is a movable pointer the action's
# owner may repoint at any commit, so the code executing with this token was whatever somebody
# else's tag resolved to at the moment of the run. Two halves of one defect: pin the code (every
# `uses:` line below) and bound what the code is trusted with (here). Either half alone leaves the
# other standing.
#
# DECLARED ONCE, AT WORKFLOW LEVEL, RATHER THAN FIVE TIMES. All five jobs need exactly
# `contents: read` and nothing else, and a rule written in more than one place survives its own
# repeal (L-2) - five copies of one line is five places for a later job to be granted more by a
# hand that only meant to edit one. A job that genuinely needs more must say so at job level, which
# overrides this and is visible in the diff of that job.
permissions:
  contents: read

jobs:
  ratchets:
    name: ratchets (scope, laws, language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # the language gate reads commit messages, so history is needed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: scope - every module bound to an ABI requirement
        run: python scripts/ratchet_scope.py

      - name: laws - no law without an armed gate and test
        run: python scripts/ratchet_decisions.py

      - name: language - the GitHub surface is English only
        run: python scripts/ratchet_language.py

  tests:
    name: tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # NODE IS AN INSTRUMENT OF THIS JOB, NAMED RATHER THAN ASSUMED.
      #
      # `tests/test_intake_survives_a_failed_writeback.py` is the only gate that RUNS the intake
      # endpoint - it drives `onRequestPost` with a stubbed KV binding, because a gate that reads
      # the file can see that a `try` is written and never what the handler answers. It reports a
      # missing `node` as a red rather than skipping (L-16), so without this step the job would
      # depend on whatever the runner image happens to preinstall: a version nothing here declares,
      # and a green that turns red the day the image changes.
      #
      # `npm ci` WAS deliberately absent here - the intake probe imports one module and installs
      # nothing. That stopped being true: `tests/test_emitted_ids_are_unique.py` reads the EMITTED
      # site and, correctly, refuses to call an empty `web/dist` a clean sweep ("zero pages and zero
      # duplicates are the same green"). It failed in this job on 2026-08-24 because the job never
      # built. Excluding it was not an option - the full suite below is deliberately BARE - so the
      # job builds instead. The note is corrected rather than left standing: a comment the artefact
      # contradicts is the defect this project exists to catch.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # THE THIRD LEG OF THE PINNING: WHAT pip RESOLVES, NOT ONLY WHAT `uses:` NAMES.
      #
      # The comment above the `permissions:` block calls a pinned action and a bounded token two
      # halves of one defect. This is the half neither of them covered. `pip install pytest
      # pytest-cov` names two packages and installs TEN, at whatever version and from whatever
      # artefact PyPI served at the moment of the run - and that code executes on this tree with
      # the same token the `uses:` lines were pinned to protect. A tag is a movable pointer; an
      # unpinned dependency set is a pointer that moves on somebody else's release schedule.
      #
      # So each job installs a COMPILED set instead: the full transitive closure, resolved once
      # under this job's own Python 3.10 and committed as `requirements/ci-*.txt` with a hash per
      # artefact. `--require-hashes` makes pip REFUSE anything that does not match, which also
      # forecloses the quieter case where a resolver serves a different wheel for the same version.
      #
      # WHEN THIS GOES RED IT IS WORKING, NOT FLAKY. The policy for moving these sets is D-30, and
      # the short of it is that a set changes by a deliberate edit and never by CI upgrading itself.
      #
      # A BLOCK SCALAR, AND THAT IS NOT STYLE. `--only-binary=:all:` is followed by a space, and
      # `: ` is how YAML spells "the key ended here" - written as a plain scalar this line is a
      # mapping inside a mapping, the file does not parse, and GitHub fails the run before a single
      # job starts. Measured on `66f61ea`: zero jobs, red in the same second it was created. `|`
      # makes the body literal text, so the colons are the installer's business and not the
      # parser's.
      #
      # THIS PARAGRAPH IS A READER'S CONVENIENCE AND IS NOT WHAT ENFORCES ANYTHING. Since D-32,
      # `tests/test_workflows_parse.py` loads every file in this directory with `yaml.safe_load`,
      # so a plain scalar that swallows a colon is refused before the push rather than on `main`
      # (LAW-WORKFLOWS-PARSE). The seven gates that passed `66f61ea` were each correct about what
      # they measure; none of them had ever opened this file with a parser.
      #
      # AND FOR **THIS** FILE THAT GATE LIVES ONLY AT THE DOOR, which is the sentence a reader of
      # this file most needs. The job below cannot judge the document it is written in: a workflow
      # that does not parse starts no job, so the copy of the test that would catch it never runs.
      # In CI it judges `codeql.yml` and `scorecard.yml`, whose failure does not stop this
      # workflow. `scripts/push.sh` is the only place `gates.yml` itself is refused before it
      # reaches `main`.
      - run: |
          pip install --quiet --require-hashes --only-binary=:all: -r requirements/ci-tests.txt

      - name: build the site
        # Must run BEFORE the suite: a gate that reads an absent artefact reports
        # `check_did_not_run`, and this project counts that as red, not as clean.
        working-directory: web
        run: npm ci && npm run build

      - name: full suite, whole tree
        # The BARE full suite, never a filtered subset. A red whole-tree run beats a green filter:
        # a filtered gate once let a red suite sign off on a sibling project.
        run: python -m pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=70

  shipped:
    name: the shipped site
    # THE ONLY JOB THAT JUDGES WHAT A READER RECEIVES.
    #
    # Every other job here reads the repository, and L-3 is the standing rule that a file in the
    # repository is not what the consumer gets. The gap was concrete rather than theoretical:
    # `test_the_built_site_has_no_link_that_it_did_not_emit` sweeps every emitted page for internal
    # links the build did not produce - it is the check that catches a dangling link WITHOUT
    # knowing what the link is about - and it opens with `if not DIST.exists(): skip`. No job here
    # ran a build, so `web/dist` never existed, so it skipped on every run since it was written.
    # The general gate was a local convenience and the ratchet counted its law among those whose
    # gate and test are present. Present is not armed; that is the whole of L-16.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # Hash-pinned, for the reason written out once in the `tests` job above. A SEPARATE file from
      # that job's: this one runs the dist-dependent assertions and needs no coverage plugin, and
      # sharing one file to save a file would install the plugin here on no job's behalf.
      # Block scalar for the `: ` reason written out at the `tests` job above.
      - run: |
          pip install --quiet --require-hashes --only-binary=:all: -r requirements/ci-shipped.txt

      - name: build the site
        working-directory: web
        run: npm ci && npm run build

      - name: gates that read the emitted artefact
        # Named explicitly rather than run as the whole suite: this job exists to prove the
        # dist-dependent assertions RAN. `-rs` prints every skip, so a check that quietly goes back
        # to skipping is visible in the log instead of passing as a green tick.
        run: python -m pytest tests/test_notes_entrance.py tests/test_emitted_artefacts.py -q -rs

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # Hash-pinned, for the reason written out once in the `tests` job above. mypy's version is
      # load-bearing here in a way ruff's is not: the step below goes RED if mypy reports ZERO
      # errors, so a mypy that got BETTER could redden `main` on an afternoon nobody touched this
      # tree. Pinned, that can only happen when somebody moves the set on purpose - which is the
      # whole of D-30, and the case that makes the policy worth writing down rather than assuming.
      # Block scalar for the `: ` reason written out at the `tests` job above.
      - run: |
          pip install --quiet --require-hashes --only-binary=:all: -r requirements/ci-lint.txt

      - name: ruff
        run: ruff check src tests scripts

      - name: mypy
        # Whole tree. A narrowly scoped type check misses exactly the errors that cross modules.
        #
        # ADVISORY ABOUT ITS FINDINGS, NEVER ABOUT ITS OWN EXECUTION, AND NOT INDEFINITELY.
        # `mypy ... || true` said all three of the wrong things at once: it swallowed the findings,
        # which was intended; it swallowed mypy failing to START, which was not; and it carried a
        # promise - blocking "once a clean baseline exists", in workflows/README.md - that nothing
        # measured and nothing would notice going unmet. The suppressed crash is the worst of the
        # three, because a mypy that could not run printed exactly what a clean baseline prints,
        # and the clean baseline is the one reading that ends the advisory state.
        #
        #   exit 0  -> the baseline IS clean: the promise's condition is MET, so this goes red and
        #              the way past is to make the step blocking and add mypy to scripts/push.sh.
        #   exit 1  -> type errors: the state this was declared for. The count is printed.
        #   exit >1 -> mypy did not run. That is not_measured (invariant 1), not a clean baseline.
        #
        # The DATE below is held by tests/test_door_matches_ci.py, which runs at the door and on
        # this workflow's daily schedule, so it goes red on its own once the date passes.
        run: |
          # ADVISORY-UNTIL: 2026-10-15 - see .github/workflows/README.md
          set +e
          mypy src --ignore-missing-imports --no-error-summary > mypy.out 2>&1
          rc=$?
          set -e
          cat mypy.out
          if [ "$rc" -ge 2 ]; then
            echo "::error::mypy DID NOT RUN (exit $rc): not_measured, not a clean baseline."
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::mypy is CLEAN, so the condition in .github/workflows/README.md is met."
            echo "::error::Drop this wrapper and add mypy to scripts/push.sh in the same commit."
            exit 1
          fi
          echo "mypy: $(grep -c ': error:' mypy.out) errors - advisory, baseline not yet clean"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: repository secret scan
        run: bash scripts/secret_scan.sh
