# Every law is anchored to a gate and a test. A dangling law fails the build.
laws:
  - id: LAW-NOT-MEASURED
    text: "not_measured is a state of its own, never a zero or a default"
    gate: src/abs_profile/measured.py
    test: tests/test_measured.py
  - id: LAW-SCOPE-RATCHET
    text: "every module is bound to an ABI-* requirement"
    gate: scripts/ratchet_scope.py
    test: tests/test_ratchet_scope.py
  - id: LAW-DECISION-RATCHET
    text: "a ratified decision with no armed gate fails the build"
    gate: scripts/ratchet_decisions.py
    test: tests/test_ratchet_decisions.py
  - id: LAW-LADDER-NAMING
    text: "L0-L5 is the subject ladder; P0-P5 are agent permissions"
    gate: src/abs_profile/ladder.py
    test: tests/test_ladder.py
  - id: LAW-MEASURE-SHIPPED
    text: "measure the SHIPPED artefact, not the file in the repository"
    gate: src/collector/divergence.py
    test: tests/test_divergence.py
  - id: LAW-READ-ONLY-COLLECT
    text: "the collector only reads; clones are shallow and deleted after the audit"
    gate: src/collector/repo.py
    test: tests/test_collector_repo.py
  - id: LAW-COVERAGE-OR-INVALID
    text: "a control map without published coverage is invalid"
    gate: src/verify/control_map.py
    test: tests/test_control_map.py
  - id: LAW-SCORER-NO-TRANSPORT
    text: "scorer imports no transport - independence is machine-proven"
    gate: src/verify/scorer.py
    test: tests/test_scorer.py
  - id: LAW-TWO-BRANCHES
    text: "verified and self_reported are separate tree branches; the distinction survives copying"
    gate: src/passport/passport.py
    test: tests/test_passport.py
  - id: LAW-NO-UNDEFINED-TRANSITION
    text: "an undefined transition is impossible, not undocumented"
    gate: src/registry/lifecycle.py
    test: tests/test_lifecycle.py
  - id: LAW-NEGATIVE-VERDICT-NEEDS-EVIDENCE
    text: "a public negative verdict is a legal act and is not issued without evidence"
    gate: src/registry/lifecycle.py
    test: tests/test_lifecycle.py
  - id: LAW-TRANSPORT-INDEPENDENT
    text: "methodology modules import no transport - proven by a second transport"
    gate: src/transport/file_transport.py
    test: tests/test_transport_independence.py
  - id: LAW-PUBLIC-STATUS-REGISTRY
    text: "the status registry is ours and mandatory; an absent projection is not a zero"
    gate: src/registry/public_registry.py
    test: tests/test_public_registry.py
  - id: LAW-SILENCE-IS-A-FINDING
    text: "silence becomes a named finding, not missing data"
    gate: src/liveness/obligations.py
    test: tests/test_liveness.py
  - id: LAW-FINITE-WATCHER-CHAIN
    text: "the watcher chain is finite and its terminus is named"
    gate: src/liveness/obligations.py
    test: tests/test_liveness.py
  - id: LAW-REISSUE-OR-FINDING
    text: "the published rows are re-issued before they lapse, and a missed interval is a named finding rather than a stale registry nobody noticed"
    # The two laws above are held by a MECHANISM that, until T-F3, no component had ever loaded an
    # obligation into. This one is held by the declaration: the gate declares the incubator's own
    # obligation and the test sweeps it against the clock, so it goes red with no commit and no
    # event once the cohort has been silent past the interval. There is no state in which it skips.
    # What RUNS it in that state is the daily `schedule:` in .github/workflows/gates.yml - every
    # other trigger needs a person to act first, which is the one thing an obligation about
    # abandonment may not assume.
    gate: src/liveness/commitments.py
    test: tests/test_reissue_obligation.py
  - id: LAW-BLOCKED-STEP-HAS-A-SENTINEL
    text: "a step blocked by something outside this repository is re-checked on an interval, the reading is written down with its date, and the block lifting is a finding rather than a silence"
    # THE LAW ABOVE WATCHES A LAPSE; THIS ONE WATCHES A BLOCKER, and the difference is what made it
    # necessary. Nothing expires while T-2.15b has nowhere to publish, so no deadline in the world
    # would ever have produced a finding - which is exactly how "cannot" turns into "forgot" when
    # the state changes on somebody else's schedule. The gate is the parser that can refuse to
    # answer: `no_target` is the reading this watch returns nearly every time, so it is the reading
    # an instrument that has stopped looking would also return, and the anchors are what stop the
    # second being printed as the first - they require BOTH deployed registries to be findable, and
    # what they establish, and the residue they do not, is written out in parse()'s own docstring
    # rather than left as "the failure becomes a red". The finding fires on the BLOCK LIFTING, not
    # on its persisting - good news stops the build, because good news is what nobody has planned
    # to notice.
    gate: src/transport/erc8004_deployment.py
    test: tests/test_validation_target_obligation.py
  - id: LAW-NO-PROBE-WITHOUT-MANDATE
    text: "active probing without a valid mandate is forbidden; the refusal names its reason"
    gate: src/mandate/mandate.py
    test: tests/test_mandate.py
  - id: LAW-ONE-ENTRY-POINT
    text: "the pipeline is one entry point; transport is passed in from outside"
    gate: src/pipeline.py
    test: tests/test_pipeline.py
  - id: LAW-SELF-APPLICATION
    text: "the incubator runs its own procedure; a verifier that exempts itself publishes an opinion"
    gate: scripts/cohort.py
    test: tests/test_pipeline.py
  - id: LAW-GATE-MUST-BLOCK
    text: "a gate that does not stop is not a gate: pushes go only through push.sh with set -e"
    gate: scripts/push.sh
    test: tests/test_ratchet_scope.py
  - id: LAW-DOOR-MATCHES-ARBITER
    text: "no step of our own gates.yml can fail on main that the door did not run; a workflow the door cannot mirror is declared with its reason; and an advisory CI step carries a dated expiry rather than a promise"
    # LAW-GATE-MUST-BLOCK is that the door STOPS; this is that it stops for the same reasons the
    # arbiter does. The gap between those two is where four red runs on `main` came from, and the
    # header of gates.yml asserting the lists were identical is what kept it invisible - so the
    # gate is the door itself and the test is the comparison, checked in both directions.
    #
    # THE SCOPE IN THAT SENTENCE IS LOAD-BEARING AND WAS WRONG WHEN FIRST WRITTEN. It read "no
    # check can fail on main", while the test reads gates.yml alone and codeql.yml and
    # scorecard.yml also trigger on push to main - a law broader than its gate, ratified in the
    # commit closing a task about exactly that. The door cannot run CodeQL, so the achievable
    # property is that our own suite is mirrored and the unmirrorable ones are named, counted, and
    # cannot grow a fourth member unnoticed.
    gate: scripts/push.sh
    test: tests/test_door_matches_ci.py
  - id: LAW-REDACT-BEFORE-ARTIFACT
    text: "secrets are redacted BEFORE the text becomes an artefact"
    gate: src/collector/github.py
    test: tests/test_github_collector.py
  - id: LAW-ENGLISH-ONLY-ON-GITHUB
    text: "the entire GitHub surface is English-only: code, docs, commit messages"
    gate: scripts/ratchet_language.py
    test: tests/test_ratchet_language.py
  - id: LAW-WEAK-SIGNAL-LIMITERS
    text: "weak-signal limiters live in code: inferred confidence, L2 ceiling, refutation bias"
    gate: src/verify/scorer.py
    test: tests/test_weak_signal_limiters.py
  - id: LAW-ADAPTER-IS-THE-BLAST-RADIUS
    text: "only the adapter knows the standard; unconfigured registry yields not_measured with a reason"
    gate: src/transport/erc8004.py
    test: tests/test_erc8004.py
  - id: LAW-UNMEASURED-NEVER-DECIDES
    text: "an unmeasured input yields not_measured, never go and never stop"
    gate: src/governance/thresholds.py
    test: tests/test_thresholds.py
  - id: LAW-NO-BARE-NULLS
    text: "a null in the machine artefact must say which world it means, or be whitelisted with that meaning in code"
    gate: src/passport/passport.py
    test: tests/test_no_bare_nulls.py
  - id: LAW-DEFAULTS-CLAIM-THE-LEAST
    text: "the least-effort construction must make the weakest claim; a default that asserts a completed check is a loaded gun"
    gate: src/passport/passport.py
    test: tests/test_passport.py
  - id: LAW-SERVED-EQUALS-LISTED
    text: "the served artefact set equals the listed set, checked in both directions and against the current schema"
    gate: scripts/cohort.py
    test: tests/test_served_set_matches_registry.py
  - id: LAW-GRANTED-CHANNEL-ONLY
    text: "a subject is read through a token granted to this project, never through host privilege"
    gate: scripts/cohort.py
    test: tests/test_granted_channel_only.py
  - id: LAW-EMITTED-ARTEFACT-IS-CHECKED
    text: "gates read the document that ships, not the classes that build it"
    gate: src/passport/passport.py
    test: tests/test_emitted_artefacts.py
  - id: LAW-TEACHING-IS-SEPARATE
    text: "teaching and verification are separate components; the surface references the corpus once, as provenance"
    gate: web/src/pages/Method.tsx
    test: tests/test_separation_single_reference.py
  - id: T-PROFILE-2
    text: "the profile is CC BY 4.0 and the schemas Apache-2.0, in files, with both halves named"
    gate: LICENSE
    test: tests/test_licence.py
  - id: T-THRESHOLD-1
    text: "a threshold is a named constant with a recorded origin, never a literal at a comparison"
    gate: src/abs_profile/ladder.py
    test: tests/test_threshold_and_blockdefault.py
  - id: T-BLOCKDEFAULT-1
    text: "a gate fails closed; a handler that swallows a failure and continues is not a gate"
    gate: src/governance/thresholds.py
    test: tests/test_threshold_and_blockdefault.py
  - id: LAW-ONE-ENUM-ONE-PLACE
    text: "an enum is declared once; a duplicate compares equal by value and false by identity"
    gate: src/registry/lifecycle.py
    test: tests/test_threshold_and_blockdefault.py
  - id: LAW-PHASE-2-DESCRIBES-NEVER-OFFERS
    text: "the phase-2 surface names no date, takes no application, renders no control, and labels every constraint enforced or evidenced"
    gate: web/src/pages/Phase2.tsx
    test: tests/test_phase_two_promises_nothing.py
  - id: LAW-STALE-IS-COMPUTED-AT-READ-TIME
    text: "a verdict lapses by time with no event, and the surface computes it rather than printing a frozen word"
    gate: web/src/types.ts
    test: tests/test_stale_on_the_surface.py

  - id: LAW-NOTES-ADDRESSED
    text: "every claim on a method note names a place in this repository that settles it, and a key is a row the base returned with the state it recorded"
    gate: web/notes/emit.mjs
    test: tests/test_notes.py
  - id: LAW-NOTES-GENRE
    text: "a method note describes the instrument and never instructs a subject; no second-person imperative, no how-to heading, no teaching vocabulary"
    gate: web/notes/emit.mjs
    test: tests/test_notes_genre.py
  - id: LAW-NOTES-FRESHNESS
    text: "dateModified moves when the body hash moves and at no other time; a rebuild manufactures no freshness"
    # The gate read `web/notes/manifest.json` - a DATA file, and one that exists at all only
    # because a failed capture wrote it on its way out. A rule is held by the code that can break
    # it, not by the record it keeps. Of the two files that could break this one, `emit.mjs` is the
    # primary: `noteLd()` there is what writes `dateModified` into the page a reader receives,
    # while `prerender.mjs` only carries the same value into the sitemap's <lastmod>.
    gate: web/notes/emit.mjs
    test: tests/test_notes_freshness.py
  - id: LAW-NOTES-CEILING
    text: "at most three notes stand until an indexation reading exists from a verified Bing Webmaster property"
    gate: web/notes/emit.mjs
    test: tests/test_notes_ceiling.py
  - id: LAW-NOTES-ENTRANCE
    text: "the way in to /method/notes/ is offered exactly when at least one note is captured - never before it, and never omitted after"
    # The only one of the note laws that is armed at ZERO notes, which is the state that shipped
    # the defect: the other four skip themselves when nothing is captured.
    gate: web/src/pages/Method.tsx
    test: tests/test_notes_entrance.py
  - id: LAW-EMITTED-IDS-UNIQUE
    text: "no emitted page defines the same id twice, because a url(#x) reference resolves to the first match and paints the second element from the wrong definition"
    # Found by the W3C validator on the LIVE note page and not by any test here: the figure hatch
    # patterns were a module constant with fixed ids, which one figure to a page hid completely,
    # and the first page ever to place two of them shipped the collision. The sweep reads every
    # emitted page rather than the notes alone - nothing about colliding ids is note-specific, and
    # the emitted document is the only place the collision is visible (L-3).
    gate: web/notes/emit.mjs
    test: tests/test_emitted_ids_are_unique.py
  - id: LAW-SURVEY-ABSENCE
    text: "in a sampled measurement, an identity we failed to read is never counted as one that failed to qualify"
    # LAW-NOT-MEASURED restated for a DENOMINATOR, because that is where it hides. A survey has the
    # one shape that makes the collapse invisible: the unreadable rows are already inside the
    # sample, so folding them into the non-matchers leaves the totals correct and only the meaning
    # wrong. Q-M1 step 2 could not read 27 of 100 sampled identities - 20 of them behind a single
    # host that serves no certificate - so the collapse would have published our own instrument
    # failure as a fact about the market.
    gate: scripts/measure_qm1_step2.py
    test: tests/test_qm1_step2_absences.py

  - id: LAW-PROBE-NEEDS-MANDATE
    text: "a denied mandate makes zero requests: the refusal is the result, and the denial reason travels with it"
    # The assertions are about the TRANSPORT and not about the check. A recording `fetch` must hold
    # nothing at all after every one of the five denial reasons, so a refactor that moved the check
    # below the first call would leave it visibly present and the property gone - which is L-21,
    # where three repairs in a gate were defined, documented and never called.
    gate: src/prober/prober.py
    test: tests/test_prober.py
  - id: LAW-PROBE-CONTROL-BEFORE-ABSENCE
    text: "a status code is not a measurement until the client has been ruled out as its cause; the control request is a veto, not a warning"
    # L-11 ARMED, and on the very origin that taught it: provek.dev answers 200 to a browser's user
    # agent and 403 to Python's default one. Without the control request, that 403 read off a
    # protected path lands in the set of refusals a subject's claim named and publishes ENFORCED -
    # the subject credited with a control that was never exercised, because the edge declined to
    # talk to US. The veto is checked in both directions: it voids a reading that would have
    # flattered the subject and one that would have accused them.
    gate: src/prober/prober.py
    test: tests/test_probe_control.py
  - id: LAW-OFFER-IS-THE-SIZE-OF-WHAT-ARRIVES
    text: "the offer a stranger decides on states the probe's cost in requests to their origin, and that number is the one the prober spends"
    # THE CLAIM THAT WAS TOO MODEST, WHICH IS THE DIRECTION NOBODY AUDITS. `/apply/` said "one
    # operation exists today" and stopped there. Every word true - there is one action, and the
    # mandate that follows names paths in the plural and a rate ceiling - and stated in OUR unit of
    # account rather than the one that arrives at the applicant's server, where a probe puts three
    # requests. A promise smaller than the artefact reads as care, so nothing looks at it.
    #
    # The gate is a COMPARISON, because after this task the number lives in three files: a constant
    # in `prober.py`, a word in the form's copy, and a sentence in `docs/WHY_GET_VERIFIED.md`,
    # which carries the same offer to the same stranger and whose own last line records that it is
    # always the last copy corrected. `CALLS_PER_PROBE` was 2 until Fable found that a probe
    # without a negative control cannot tell a withheld path from one that was never there; the
    # next such finding moves it again, and neither piece of prose is open in the editor that day.
    # What was missing was never the value - it was the comparison (D-20). Both surfaces are held
    # by the same assertions: a rule armed on one copy and not the other is the defect itself.
    #
    # PRESENCE is checked in the OPTION and not across the file: `three requests` appears elsewhere
    # in `Apply.tsx` - the confirmation screen, the file's own docstring - so a whole-file search
    # for the number would be green over exactly the copy this law replaced. The rest is checked
    # over the WHOLE page, because a scope with a terminator has one: an earlier draft ended the
    # confirmation's scope at `</p>`, and splitting that paragraph in two carried the count out of
    # it. Every red is kept in evidence/RED-019-an-offer-narrower-than-what-arrives.txt, one of
    # them the option withdrawn as D-21 once withdrew it - where the honest outcome is a red saying
    # the gate now guards nothing, not a green earned by having nothing left to check.
    #
    # MOST OF THEM WERE GREEN AGAINST EARLIER DRAFTS - the artefact counts which, in a line the
    # generator computes from its own mutation table, and the number is deliberately not repeated
    # here. It was repeated here, said SEVEN where the run said SIX, and it was retyped by hand in
    # the same commit that fixed exactly this defect one file away. A count is a claim with a
    # maintenance cost, and this one has already been wrong three times.
    #
    # They were found by Fable over several rounds - the count is the ROUND headings in the
    # artefact and is deliberately not a number here, because it stood here as THREE against
    # four mutations found in two, in the very paragraph above that calls a hand-typed count a
    # claim with a maintenance cost. That makes it the fourth such drift in this pair, and the
    # rule is now applied to itself rather than restated. They are what this law is really for.
    # Softening sentences a later hand would add - "in
    # practice it is usually a single CALL", then "a single LOOKUP", then "a couple of requests",
    # then "your server hears from us ONCE" - each walked past a draft that counted NOUNS, because
    # nobody softening a claim reaches for the noun the claim was made in and the last of them
    # names no noun at all. The gate counts numerals now: a list of synonyms is never finished, and
    # a list of the numbers a page may state can be. Beside those, the confirmation screen carried
    # its own copy of the number with nothing comparing it - and when that was scoped from
    # `sent.asked` to the next `</p>`, splitting the paragraph in two moved the count out of the
    # scope and "ninety HTTP requests" went green.
    #
    # Obliged to state the cost is one rule and obliged to state it correctly is another. The two
    # places the offer is MADE owe both; the whole intake page and the whole offer section of the
    # document owe the second. The document had the weaker noun-based check for one round and it
    # was the wrong trade - it could not see "your server hears from us once", and a blind spot
    # written down is still a blind spot (L-25).
    #
    # THE DECLARATIONS ARE THE ONLY DOOR, so they are the only thing that can rot, and both ways
    # are held. A declaration must SPAN its number inside its own sentence - a set of short keys
    # granted `only one` everywhere it appeared, and six false promises walked through without a
    # line being added to the list, one of them telling an applicant on the confirmation screen
    # that what reaches their production system is one request. And a declaration whose sentence
    # has been rewritten is itself a red, because a permission for copy that is gone is one the
    # next editor meets as agreement.
    #
    # AND WHAT COUNTS AS "THE COPY" IS THE HARDEST PART OF THIS GATE, not the rules over it. Four
    # drafts of the extractor each admitted or dropped the wrong thing, and every one was green
    # over a promise: `{...}` stripping deleted the whole confirmation screen; `'...'` stripping
    # ate the sentence between two apostrophes; stripping every string deleted copy declared as a
    # constant and rendered through an expression, which is how `ISSUES` and `DECISION_LOG` are
    # already written on that page; and drawing the line by ROLE put `title` on the copy side, so
    # a tooltip could state the count while the visible sentence read "costs your origin very
    # little" - read by a mouse, by nobody on a touchscreen or a keyboard. Twice more, presence and
    # the strict rule were reading two different extractions of one file, and keeping the module
    # made `if (r.status === 429)` a red about promises to applicants, which is the false red that
    # gets a gate switched off.
    #
    # It reads THE JSX RETURN BLOCKS now - matched by parenthesis depth, so no function body is
    # copy and a status code cannot be reported as a promise - plus any string SHAPED LIKE PROSE
    # wherever it is declared, since naming the copy-carrying syntax was fitted to the two
    # spellings this page happens to use and missed `export const`, `let`, an object field and a
    # ternary of two sentences. Attribute strings are excluded from that, and the readable
    # attributes are gathered for CONTRADICTION only - never for compliance. Instrument controls
    # hold each of those properties, two of them feeding the extractor prose of their own so no rewrite of the page
    # can disarm them; their number is not written here, because the one that was is the third
    # hand-typed count in this pair to disagree with the artefact beside it.
    #
    # WHAT IT DOES NOT CATCH, stated because the alternative is discovering it: unquantified
    # vagueness. "A minimal probe", "barely touches your server" - no numeral, so nothing to
    # compare. Policing adjectives would be a rule with no measured quantity under it, which is the
    # rubber stamp `scripts/ratchet_scope.py` warns about; if it is wanted it is a different law.
    # What keeps that boundary honest is the presence rule holding on the SAME text the strict rule
    # reads: vagueness may stand beside the count, never instead of it. That argument was made once
    # while presence could be satisfied by an attribute no visitor sees, which made it false.
    #
    # The gate below is the FORM because that is where a stranger decides; the document is the
    # second file this law holds and is named here rather than given an entry of its own, since one
    # law enforced from two rows is the shape that survives its own repeal.
    gate: web/src/pages/Apply.tsx
    test: tests/test_apply_names_the_probe_cost.py

  - id: LAW-INTAKE-SAVED-MEANS-SAVED
    text: "the intake tells an applicant that nothing was saved only where nothing was saved, and a caught refusal leaves a mark wherever the store will take one"
    # THE FIRST GATE HERE THAT RUNS THE SITE'S CODE INSTEAD OF READING IT. The write-back after the
    # notice sat outside any try, so a refused second write became a 500 and the form told the
    # visitor their submission was lost while it sat in KV and the operator's notice had gone out.
    # Workers KV allows one write per second to the same key and these are two writes to one key in
    # one invocation, so the path is ordinary rather than exceptional.
    #
    # Asserted as a biconditional, because the cheap fix breaks the other half: when the DURABLE
    # write fails, nothing is stored, "Nothing was saved" is true, and the endpoint must still
    # fail. A try/catch aimed one line too high satisfies the first direction and turns the intake
    # into a form that always says yes - and nobody sweeps for a record that was never written.
    #
    # AND THE SECOND CLAUSE IS THE FIRST DRAFT'S OWN DEFECT. Catching the refusal silently gave
    # `delivered: null` a second meaning - it had meant "the invocation died and its submitter was
    # told nothing was saved", and now also meant "told the truth, needs nothing" - which are
    # opposite instructions to the operator, in one value. Invariant 1, arriving inside the change
    # that closed another instance of it, argued away in a comment claiming there was nowhere
    # durable left to write when the limit is per KEY and a different key was available. So the
    # law covers the sentinel too: written on a refusal, absent otherwise, carrying the store's own
    # reason - and absent again when the sentinel's own write is refused, which is the one state
    # where the silence really is forced and is read as the death case. Found by Fable (L-28).
    gate: web/functions/api/apply.js
    test: tests/test_intake_survives_a_failed_writeback.py

  - id: LAW-INTAKE-SWEEP-NAMES-ITS-STATES
    text: "the sweep finds every record whose delivery outcome is not true, prints the states under different labels, and reports its own refusal as neither a finding nor a clean run"
    # THE GATE IS A FENCED BLOCK IN A DOCUMENT, and that is the point of it. The KV sweep is the
    # only instrument that finds a submission nobody has followed up, and nothing in a Markdown
    # file fails a build: it had been edited twice with no run behind either edit. The filter
    # matched `delivered == false` alone - blind to the state both of T-A2-2's failures land in -
    # and the widening that found them printed both under one word, which is invariant 1 one level
    # up from the field it is usually about. `false` is answered by reading the record now;
    # `null` is answered against the sentinel beside it; neither instruction is derivable from the
    # other.
    #
    # AND AN INSTRUMENT THAT CANNOT REPORT ITS OWN REFUSAL. A failed `get` printed nothing, which
    # is what a healthy record prints; a failed `list` produced no keys, which is what an empty
    # namespace produces - and the document reads an empty namespace as the finding that no
    # submission has ever been made. So the exit status carries three states rather than two, and
    # the count is printed on every run that ran.
    #
    # The test EXTRACTS the block and RUNS it against a stubbed namespace (tests/kv_stub.py): a
    # gate that grepped the document would pass over every one of those defects, since each of
    # them contains the strings a grep would look for. Twenty-two red runs in
    # evidence/RED-018-a-sweep-that-cannot-name-what-it-found.txt, FOURTEEN of which were GREEN
    # when Fable applied them over three rounds - including the sweep's own sentence "no submission has
    # ever been made", which the first draft printed over a namespace holding a submission it had
    # failed to read. A claim stronger than the artefact, introduced by the change that closed one,
    # in the instrument this document keeps for finding them.
    gate: docs/INTAKE_OPERATIONS.md
    test: tests/test_intake_sweep_distinguishes_its_states.py

  # T-C5. The scheduler could not publish at all until this task - `step_deploy` looked for a
  # `wrangler` binary that is not on this host and reached `blocked_no_tool` every time - so the
  # question "what does an unattended deploy ship?" had never had to be answered. Turning the step
  # on answers it: `wrangler pages deploy` uploads the working tree, and this tree routinely holds
  # work parked between tasks. On the morning this law was written, a T-A2-5 change to `/apply/`
  # sat in it unpushed, two hours before the day's slot, with nobody at the keyboard.
  #
  # The gate is NOT "refuse a dirty tree". The cycle dirties the tree itself - it writes a note and
  # rewrites the manifest - so that rule would stop every cycle forever and be deleted by the first
  # agent it stopped. It is "refuse a tree dirty OUTSIDE the paths the cycle writes".
  #
  # T-C8 ARMED THE OTHER HALF OF THE TEXT BELOW - "unreadable is not clean" - rather than adding a
  # law. `git status` has TWO ways of saying it did not read the tree, and this gate read one: a
  # nonzero exit, and a warning on stderr beside an exit of ZERO. The second is the one that
  # actually occurs - a directory the process cannot enter - and under it the gate answered
  # PUBLISHABLE over a tree holding a file nothing had opened (measured, evidence/RED-035-*). D-33
  # carries the reasoning and the price: any stderr is a refusal, its text is not parsed, so a false
  # red is possible and is accepted because what it reports is the INSTRUMENT stopping rather than a
  # verdict about the tree.
  - id: LAW-PUBLISH-JUDGED-TREE
    text: "the unattended publisher ships only a tree the gates judged; unreadable is not clean"
    gate: scripts/publishable_tree.py
    test: tests/test_publishable_tree.py

  # T-H2 - THE SAME DOOR, ASKED WHAT THE THING GOING THROUGH IT IS CALLED. The gate above decides
  # whether the SCHEDULER may publish. This one decides what ANY publication is named, and the two
  # differ in both directions: a human deploy has no cycle-owned exemption, and a human may
  # deliberately publish a dirty tree, which the unattended cycle may never do.
  #
  # The permission and the label are separate and the second is the point. `--allow-dirty` lets the
  # operator publish an unjudged tree; it does not let that deployment keep calling itself by a
  # commit's name. Without the second half the flag would reopen the hole with a nicer spelling.
  - id: LAW-DEPLOY-LABEL-TRUE
    text: "a deployment is never named by a commit it differs from"
    gate: scripts/deploy_label.py
    test: tests/test_deploy_label.py

  # T-H2, second half, and the reason the law above needed one. `verify_live.sh` measures LIVENESS -
  # eight addresses and their codes - and every one of those codes is answered just as well by last
  # week's deployment. So "wrangler exited 0 and landed nowhere" read GREEN through the whole deploy
  # script, and D-26's claim that a wrangler regression would be caught was true of exactly one
  # class of breakage. The label is now written into the upload and read back off the live site,
  # which is the only thing that separates a fresh deployment from a working stale one.
  #
  # The name of the file is a constant in ONE place, and the round trip in the test drives both
  # halves of the script against each other rather than naming it a second time (L-2).
  - id: LAW-DEPLOY-LANDED
    text: "the deployment answering on the live site is the one this run published; liveness is not freshness"
    gate: scripts/deploy_stamp.sh
    test: tests/test_deploy_stamp.py

  # T-S1, second half. `ca539ec` pinned the actions; three `pip install` lines in the same file
  # resolved their transitive closure fresh from PyPI on every run, with the same token. D-30 pins
  # them to hash-checked sets - and this law exists because that pinning is one edit from being
  # undone, in a repository where no other gate could see it happen: `test_door_matches_ci.py`
  # classifies any line beginning `pip install` as runner preparation, so the reverted line would be
  # waved through by the gate built to catch steps that slipped the table.
  #
  # The law is about SHAPE, which is a fact about the tree. Whether a digest is the one PyPI serves
  # is enforced by pip itself on every install, and whether a bump was WISE is a fact about an edit
  # that no checker can read - that half stays prose in D-30, which is L-8's honest kind of
  # gateless rather than a cover for the half that is measurable.
  - id: LAW-CI-PIP-HASH-PINNED
    text: "every pip install in a workflow names a committed, fully hash-checked set inside this tree"
    gate: scripts/verify_pip_pins.py
    test: tests/test_pip_pinned.py

  # T-S4. `web/src/App.tsx` interpolated a substring of `location.pathname` straight into
  # `/data/passports/<slug>.json`; `route.slice(3).replace(/\/$/, "")` strips a trailing slash and
  # nothing else, so an inner `/` walked out of the directory. The finding is not a scanner's - it
  # was raised by the 2026-08-24 triage against itself, in the act of dismissing CodeQL #6 and #7
  # on the FROZEN `web-1.0/` copy, whose fetch went through a `.replace(/[:/]/g, "_")` that removes
  # the separator. The live tree was a superset of the code CodeQL objected to in the frozen one and
  # carried no alert of its own, which is `not_measured` rather than `clean` - so this law exists
  # instead of a note recording that the scanner is content.
  #
  # The gate is a module the test RUNS, not a pattern it matches. `web/src/slug.js` is plain
  # JavaScript so that `tests/slug_probe.mjs` loads the same bytes the bundle ships: Node here is
  # v20 and cannot strip types, and a compiled `.ts` would make the gate an assertion about the
  # compiler's output. The rule is one re-implementation away from being wrong in a way no source
  # scan could see - `^[A-Za-z0-9_-]+$` accepts a trailing newline in Python's `re` and refuses it
  # in JavaScript - which is the whole argument for executing it.
  #
  # What stays prose: that the DEPLOYED bundle enforces this. The suite reads the repository and
  # runs one module out of it, and `verify_live.sh` reads status codes rather than behaviour. That
  # boundary is named in the test's own WHAT IS NOT ASSERTED paragraph, in L-25's form, rather than
  # left to be inferred from what the file happens to open.
  - id: LAW-SLUG-JUDGED-BEFORE-FETCH
    text: "a passport slug is judged against the emitter's own character class before it reaches a URL, and a refusal is its own state and never a missing passport"
    gate: web/src/slug.js
    test: tests/test_passport_slug_is_judged_before_it_is_fetched.py

  # T-S6. `scripts/run_budgeted.sh` carries the only enforcement of "concurrency = 1 process" in
  # CLAUDE.md's resource budget, and until this law nothing in the suite RAN it - the module was
  # bound to ABI-33-1 in the requirement map and judged by no assertion. Being bound to a
  # requirement and being tested against it are different facts, and the ratchet that checks the
  # first cannot see the second.
  #
  # The law is stated in two halves because the defect had two, and the second is the one no exit
  # status reports. THE PATH: a fixed name in the host's mode-1777 /tmp, where arrival order
  # decides ownership and a neighbour's symlink is indistinguishable from our own file. THE
  # REPORT: `if ! flock -n 9` folded every non-success into "the slot is held by another run", so
  # a lock that could not be opened and a `flock` that is not installed both announced a healthy
  # concurrency limit at the moment the limit had stopped existing - and returned EX_TEMPFAIL,
  # telling the caller to retry something that will never succeed.
  #
  # The gate is the script itself and the test RUNS it, with a real command, asking whether that
  # command executed. That is not a stylistic preference: the worst form of this defect exits 0
  # and prints nothing at all, so "it refused" and "it did not do the work" are two claims and
  # only the second one is the guarantee. Red run, six mutations, in
  # evidence/RED-033-a-lock-that-was-never-taken-reported-as-contention.txt.
  - id: LAW-BUDGET-LOCK-UNDER-THE-PROJECT
    text: "the concurrency lock is opened on a path the project owns and verified to BE that path, and a lock that could not be taken is a named refusal that runs nothing, never a report of contention"
    gate: scripts/run_budgeted.sh
    test: tests/test_run_budgeted_names_its_refusals.py

  # T-S7. `66f61ea` was pushed with 7/7 gates green here and turned `main` RED in the same second:
  # `--only-binary=:all: ` sat in a PLAIN scalar, `: ` ended the key, and the run was created and
  # concluded with ZERO jobs. Nothing in the workflow failed, because nothing in it ever started.
  #
  # The law is about the FILE, not about its contents, and that is the whole distinction it adds.
  # `scripts/verify_pip_pins.py` and `scripts/verify_action_pins.py` judge what the workflow NAMES
  # and both read it with a hand-written scanner; that scanner accepted a document the real parser
  # refuses, so seven gates certified a file the machine they stand in for could not open. Until
  # this law nothing in this repository loaded a workflow with a YAML parser.
  #
  # WHAT IT DOES NOT CLAIM, since the split is the honesty of it: PyYAML is not GitHub's parser and
  # implements YAML 1.1 where most modern parsers implement 1.2, so acceptance here is not proof of
  # acceptance there, and no schema is checked - a misspelt key parses perfectly. A `gates.yml` that
  # PARSES and breaks GitHub's workflow schema reproduces the whole RED-031 symptom, startup failure
  # and blind `/check-runs` included, and for that class `actions/runs?head_sha=` is still the only
  # instrument. What is bought is the class of defect that was actually paid for, refused at the
  # door instead of on `main`. The residue is named in D-32 rather than closed, because closing it
  # needs GitHub's own parser.
  #
  # THE LAW SAYS "AT THE DOOR" AND NOT "BEFORE IT IS PUSHED", and the difference is load-bearing
  # rather than pedantic. In CI this gate cannot judge `gates.yml`: a workflow that does not parse
  # runs no job, so the job holding the test never starts and the defect deletes its own detector.
  # The first draft of this line said "before it is pushed", which reads as a property of the
  # pipeline when it is a property of `scripts/push.sh` - and this is the one line the ratchet
  # reads, so it will outlive the paragraphs in D-32 and the README that say so. Found by Fable.
  - id: LAW-WORKFLOWS-PARSE
    text: "every workflow file is loaded by a real YAML parser AT THE DOOR - in CI a file that does not parse runs no job, so this cannot judge itself there - and a parser that is absent, a file that cannot be read and a directory with no workflows are each their own state rather than a clean tree"
    gate: scripts/verify_workflow_yaml.py
    test: tests/test_workflows_parse.py
