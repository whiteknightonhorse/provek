<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Provek">
  <!-- The unfilled slot. This product's rule is that no emblem may exist before the method does,
       so the icon is the one mark the interface already uses to mean something: a ruled blank
       where a value would have gone. Two of the three slots are empty, which is the true coverage
       of every passport in the registry today. -->
  <rect width="32" height="32" fill="none"/>
  <rect x="5"  y="9"  width="22" height="3" rx="0.5" fill="#16171c"/>
  <rect x="5"  y="17" width="22" height="3" rx="0.5" fill="#8d8677"/>
  <rect x="5"  y="25" width="22" height="3" rx="0.5" fill="#8d8677"/>
</svg>
