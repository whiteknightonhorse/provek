<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provek — evidence, not claims</title>
    <meta name="description" content="A verification and reputation layer for businesses operated by AI agents. Measured per operation, from evidence." />
    <link rel="canonical" href="https://provek.dev/" />

    <!-- Open Graph. A passport travels by link in due-diligence email, which is this product's only
         real distribution channel, and without these tags such a link unfurls as a bare URL.
         The values below are the shell's; `prerender.mjs` rewrites the per-page ones into each
         emitted document - `og:url`, `og:title`, `og:description`, both `twitter:*` twins, the
         `<title>`, the description and the canonical - so a passport unfurls as its subject.
         `404.html` is the single exception and a deliberate one: it is written with the canonical
         and `og:url` stripped out, because the document standing in for every missing address has
         no address of its own to declare.

         THIS COMMENT DECLARED A CEILING THAT HAD ALREADY BEEN LIFTED. It read "routing is by hash,
         so a crawler never sees anything past the '/' and every passport shares one preview". The
         first half stopped being true at `bedb764` on 2026-08-20, the commit that moved routing to
         the path and emitted each page as a file with its own `og:title`. The second half outlived
         it on one channel: `twitter:title` and `twitter:description` were rewritten by nothing
         until `f857e74`, later the same day, so every card went on advertising the front page.

         That makes this the THIRD copy of the same stale reason. The first was the comment over the
         GA snippet below, corrected at `3e97acc`; the second was `DECISIONS.md` D-14, corrected on
         2026-08-21; this one stood in the file that ships the tags it describes and was found only
         by refutation - L-2, in the place nobody thought to re-read.

         What IS still a ceiling, stated rather than left to be discovered: there is no `og:image`
         anywhere in this site, so every unfurl is text on a `summary` card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Provek" />
    <meta property="og:url" content="https://provek.dev/" />
    <meta property="og:title" content="Provek — evidence, not claims" />
    <meta property="og:description" content="Per business operation, how much of a company runs without a human in the loop — with the evidence behind every number, including what could not be measured." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Provek — evidence, not claims" />
    <meta name="twitter:description" content="Per business operation, how much of a company runs without a human in the loop — with the evidence behind every number, including what could not be measured." />

    <!-- GA4, operator's decision of 2026-08-20, recorded as D-14.
         Fable ruled against measurement on this surface and the operator overruled it; the record
         says so rather than presenting this as an unexamined default.

         Two flags are set that the operator did not ask for and that do not alter what he chose to
         collect: Google Signals and ad-personalisation signals are OFF. They feed advertising
         profiles rather than the audience counts this is here to answer, so leaving them on would
         collect more than the decision covers. `send_page_view` is false because the router
         is ours: gtag would count only the first screen and miss every navigation after it. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QD2522TMYP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QD2522TMYP', {
        send_page_view: false,
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });
      // ROUTING IS BY PATHNAME, not by hash. This counted `hashchange` for fourteen minutes
      // before the static-emit change moved routing to pushState, and then kept counting it -
      // so every visit recorded one view of "/" whatever page it was, and client-side
      // navigations recorded nothing at all. A measurement decision that cost an argument and
      // then returned garbage is worse than no measurement, so this reads the real route and
      // hooks the same events the router does.
      (function () {
        var seen = null;
        function view() {
          var path = location.pathname || '/';
          if (path === seen) return;
          seen = path;
          gtag('event', 'page_view', {
            page_path: path,
            page_location: location.href,
            page_title: document.title
          });
        }
        addEventListener('popstate', view);
        // pushState fires no event of its own; the router calls it on every internal link.
        var push = history.pushState;
        history.pushState = function () {
          push.apply(this, arguments);
          setTimeout(view, 0);
        };
        addEventListener('load', function () { setTimeout(view, 0); });
        view();
      })();
    </script>
    <!-- The SVG was the only icon declared, and it was the only one that existed: /favicon.ico,
         /apple-touch-icon.png and /site.webmanifest all answered 404 on the live site. That is not
         a cosmetic gap. Google's result pages and Safari's tabs fetch the raster names by
         convention, not the declared SVG, so the mark was absent exactly where a stranger meets
         the site first. The rasters below are rendered FROM favicon.svg, so there is one design
         and several encodings of it, never a second drawing that can drift from the first. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
