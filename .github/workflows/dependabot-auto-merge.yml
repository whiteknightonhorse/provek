name: dependabot auto-merge

# THE MANUAL STEP THIS TASK JUST DID BY HAND, MADE UNNECESSARY.
#
# Eight Dependabot PRs landed on 2026-09-01. Six were patch/minor bumps with every gate green at
# their head SHA and were merged after that measurement; two bumped one half of a paired GitHub
# Action reference (codeql-action/init, codeql-action/analyze) and were left open because
# `analyze (python)` and `analyze (javascript-typescript)` failed with "Loaded a configuration file
# for version '4.37.9', but running version '4.37.8'" — the two pins must move together, which this
# workflow cannot fix and does not try to: `gh pr checks --watch` below reports a red check and the
# job stops before the merge line ever runs.
#
# WHY NOT BRANCH-PROTECTION REQUIRED CHECKS + `gh pr merge --auto`. That was tried first and
# reverted the same day: `main`'s branch protection ALSO applies to the direct `git push` this
# repository's own door (`scripts/push.sh`) uses after running the same seven gates locally, and
# `gates.yml` only reports a check for a commit on `main` on the `push` trigger — AFTER it already
# landed, never before. Requiring status checks to already exist for a commit that has never yet
# been pushed makes every direct push fail with "required status checks are expected", which is
# exactly what happened here and is not a workflow this repository is changing. So this workflow
# watches the checks ITSELF instead of asking GitHub's auto-merge to gate on required ones — the
# same wait this task just did for the eight PRs above, by hand, with `check-runs` on the head SHA.
#
# MAJOR NEVER AUTO-MERGES, ON PURPOSE. `dependabot/fetch-metadata` reports `update-type`; the merge
# step only fires for `semver-patch` and `semver-minor`. A major bump is left open and unmerged —
# "full access" was granted as the right to act without asking, not the right to stop looking, and
# a major version is exactly the class of change this project's own operator drew that line at.
#
# WHY `pull_request_target`. Dependabot's branches live in THIS repository (never a fork), so the
# elevated-token risk that trigger exists to warn about does not apply here, and it is the trigger
# that actually carries write permission to call `gh pr merge`.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# NARROWED TO THE ONE JOB THAT USES IT (OpenSSF Scorecard's Token-Permissions check, alert #75).
# A `permissions:` block at workflow level grants it to every job the file will ever gain; this
# file has exactly one, so the workflow-level default (read-only) stands and the job below states
# what it actually needs - same pattern `scorecard.yml` already uses for its own single job.
# `checks: read` was added alongside `contents`/`pull-requests` for the same reason: it is what
# the polling step below spends it on, reading `check-runs` for the PR's head SHA, no more.
permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # `gh pr checks --watch` blocks until every check on the PR's OWN head SHA has completed -
      # and this job's own run is one of those checks (it shows up on the head SHA as the check
      # named "auto-merge"), so `--watch` wound up waiting for itself and never returned; three
      # PRs sat "in_progress" for 5+ hours before GitHub killed the job at the six-hour mark.
      # `gh pr checks` (checked against cli/cli's own flag list, not assumed) has no flag to drop
      # one check by name: `--required` filters by branch-protection requirement, which this repo
      # does not configure (see above), so it would show none of the nine real checks either.
      # Poll the check-runs REST API on the PR's head SHA directly instead.
      #
      # T-08, measured on PR #18's head 19a69821 (`check-runs?filter=all`, both `filter=all` and
      # the default returned the identical 19 rows): excluding "self" by `$GITHUB_RUN_ID` inside
      # `details_url` only drops THIS run's own check-run, not a STALE one left by an EARLIER
      # trigger of this same job on the same head SHA. That SHA carried two check-runs named
      # "auto-merge" - one from a run GitHub killed at its six-hour ceiling (`cancelled`, a leftover
      # from e5e613c's old self-wait bug, predating the 69fb4e1 fixup) and this run's own. Run-id
      # filtering left the old `cancelled` one in `$others`; `cancelled` is not `success`, `skipped`
      # or `neutral`, so the loop read it as a red check and failed six seconds after starting,
      # before the nine real checks had even registered. Filter by check-run NAME instead - stable
      # across every past and future run of this job, not just the one running right now - using
      # `github.job` rather than a literal "auto-merge" so a future rename of the job id stays
      # self-referential instead of silently reintroducing either bug. Checked against every other
      # workflow in this repo (gates.yml, codeql.yml, scorecard.yml): none names a job "auto-merge",
      # so this is not colliding with an unrelated real check of the same name.
      #
      # Measured against PR #18's head SHA while it sat blocked: the nine real checks all reached
      # `completed` within about ninety seconds of this job starting, so the ten-minute ceiling
      # below is wide headroom, not a tight fit, and a run that actually hangs fails on its own
      # clock with a named reason instead of riding GitHub's six-hour kill.
      #
      # `count -eq 0` IS ITS OWN STATE, DISTINCT FROM "ZERO PENDING" (invariant 1, CLAUDE.md).
      # e5e613c's first version broke out of the loop on `pending -eq 0` alone, and on the very
      # first poll - before GitHub has registered any of the other nine check-runs against a head
      # SHA that has existed for a few seconds - `$others` is `[]`: nothing is pending because
      # nothing has been measured, and the old code read that as "everything is green" and merged
      # a PR whose real checks had not even started. Fable's ruling on e5e613c named this the same
      # shape as `gh pr checks --watch`'s own old behaviour with zero checks reported (it errored,
      # rather than passing) - so this loop now requires `count -gt 0` before treating `pending -eq
      # 0` as done, and an all-empty run times out with its own named reason instead of merging.
      - name: wait for the other checks, then merge patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_LIMIT_SECONDS ))
          while true; do
            others=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --paginate --jq '.check_runs[]' \
              | jq -s --arg job_name "$JOB_NAME" \
                  '[.[] | select(.name != $job_name)]')

            count=$(jq 'length' <<<"$others")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$others")
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | .[].name' <<<"$others")

            if [ -n "$failed" ]; then
              echo "::error::red check(s) on ${HEAD_SHA}, not merging: $(tr '\n' ',' <<<"$failed")" >&2
              exit 1
            fi
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$count" -eq 0 ]; then
                echo "::error::no other checks were ever registered on ${HEAD_SHA} after ${WAIT_LIMIT_SECONDS}s, not merging" >&2
              else
                echo "::error::checks on ${HEAD_SHA} still pending after ${WAIT_LIMIT_SECONDS}s, not merging" >&2
              fi
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_NAME: ${{ github.job }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_LIMIT_SECONDS: 600
          POLL_INTERVAL_SECONDS: 15
